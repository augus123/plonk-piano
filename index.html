<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plonk Piano</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Grandstander:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout idea: a toy console by a night pond. Plonk (lime monster, piano keys for teeth) sits along the bottom of every screen; chunky sticker-like controls stack above him. One visual world, so one theme. */
  color-scheme: dark;
  --ink:#06202a; --pond:#0e3443; --pond-2:#15475a; --paper:#f2fbf0; --mute:#a5c9cc;
  --plonk:#8be04e; --plonk-d:#58b12a; --sun:#ffc83d; --berry:#ff5d8f;
  --display:"Bagel Fat One","Arial Rounded MT Bold",ui-rounded,system-ui,sans-serif;
  --body:"Grandstander","Trebuchet MS",ui-rounded,system-ui,sans-serif;
  --line:3px solid var(--ink); --drop:0 5px 0 var(--ink); --r:18px;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--pond);color:var(--paper);font:500 16px/1.35 var(--body);overflow:hidden;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
h1,h2,h3,p{margin:0}
h2,h3{font-family:var(--display);font-weight:400;text-wrap:balance}
#app{height:100%;display:flex;flex-direction:column}
.screen{flex:1;min-height:0;display:flex;flex-direction:column}
.screen[hidden],[hidden]{display:none!important}
.scroll{position:relative;flex:1;min-height:0;overflow-y:auto;padding:14px 16px 28px;-webkit-overflow-scrolling:touch}

/* buttons */
.btn{background:var(--paper);color:var(--ink);border:var(--line);border-radius:14px;box-shadow:var(--drop);padding:9px 16px;font-weight:800;line-height:1.15;transition:transform .06s,box-shadow .06s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn.sun{background:var(--sun)} .btn.lime{background:var(--plonk)} .btn.berry{background:var(--berry)}
.btn.sm{padding:6px 12px;font-size:14px;border-radius:12px;box-shadow:0 4px 0 var(--ink)}
.btn.on{background:var(--plonk)}
.ib{width:42px;height:42px;flex:none;display:grid;place-items:center;padding:0;font-size:20px;background:var(--paper);color:var(--ink);border:var(--line);border-radius:13px;box-shadow:0 4px 0 var(--ink);font-weight:800}
.ib:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.ib.on{background:var(--plonk)}
.ib svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}

/* top bar */
.bar{flex:none;display:flex;align-items:center;gap:10px;padding:10px 16px 8px}
.bar h2{font-size:clamp(19px,5.4vw,24px);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttl{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.ttl b{font-family:var(--display);font-weight:400;font-size:clamp(16px,4.6vw,19px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meter{height:12px;border:2px solid var(--ink);border-radius:8px;background:var(--pond-2);overflow:hidden}
.meter i{display:block;height:100%;width:0;background:var(--sun);border-right:2px solid var(--ink);transition:width .25s}

/* home */
.home-top{flex:1;min-height:0;overflow-y:auto;padding:18px 16px 10px;display:flex;flex-direction:column;gap:12px;max-width:760px;width:100%}
.logo{font:400 clamp(58px,17vw,104px)/.85 var(--display);color:var(--plonk);letter-spacing:.01em;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 6px 0 var(--ink)}
.tag{font-size:17px;font-weight:700;color:var(--mute)}
.doors{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin-top:4px}
.door{display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:12px;align-items:center;text-align:left;padding:13px 16px;background:var(--paper);color:var(--ink);border:var(--line);border-radius:var(--r);box-shadow:0 6px 0 var(--ink)}
.door:active{transform:translateY(5px);box-shadow:0 1px 0 var(--ink)}
.door.kid{background:var(--sun)}
.door .em{grid-row:1/3;font-size:38px;line-height:1}
.door b{font:400 23px/1.05 var(--display)}
.door small{font-size:14px;font-weight:700;opacity:.8}
.home-row{display:flex;flex-wrap:wrap;gap:10px}
.hero-wrap{flex:none;position:relative;height:clamp(170px,40%,340px)}
.hero-wrap canvas,#stageWrap canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hero-bubble{position:absolute;right:16px;top:-6px;z-index:1;background:var(--paper);color:var(--ink);border:var(--line);border-radius:14px;padding:5px 12px;font-weight:800;font-size:15px;transform:rotate(3deg);pointer-events:none}

/* kids map */
.world{margin-bottom:22px}
.world h3{font-size:25px;color:var(--wc);display:flex;align-items:baseline;gap:10px;margin-bottom:10px}
.world .wn{font:800 12px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--ink);background:var(--wc);border-radius:8px;padding:3px 8px}
.path{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:14px 10px}
.lv{display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:0;padding:0;color:var(--paper)}
.lv:nth-child(even){transform:translateY(10px)}
.lv-ic{width:66px;height:66px;display:grid;place-items:center;font-size:30px;background:var(--pond-2);border:var(--line);border-radius:50%;box-shadow:0 5px 0 var(--ink)}
.lv:not(.locked) .lv-ic{background:var(--paper)}
.lv.done .lv-ic{background:var(--wc)}
.lv:active:not(.locked) .lv-ic{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.lv.next .lv-ic{animation:bob 1s ease-in-out infinite;background:var(--sun)}
.lv.locked{opacity:.55;cursor:default}
.lv-st{font-size:14px;letter-spacing:1px;color:var(--sun);height:17px}
.lv-t{font-size:13px;font-weight:700;line-height:1.15;text-align:center;max-width:100px}
@keyframes bob{50%{transform:translateY(-6px)}}

/* song list */
.upload{background:var(--pond-2);border:3px dashed var(--mute);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px;align-items:flex-start;margin-bottom:20px}
.upload.over{border-color:var(--sun);background:#1b566c}
.upload b{font:400 22px var(--display)}
.upload p{color:var(--mute);max-width:60ch}
.err{color:#ffd0dc!important;font-weight:700}
#songList h3{font-size:20px;margin:6px 0 10px}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin-bottom:22px}
.song{display:flex;align-items:center;gap:10px;background:var(--paper);color:var(--ink);border:var(--line);border-radius:14px;box-shadow:var(--drop);padding:10px 12px;text-align:left;min-width:0}
.song:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.song .s-main{flex:1;min-width:0}
.song .s-name{font-weight:800;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.song .s-sub{font-size:13px;font-weight:700;opacity:.7}
.song .s-st{color:#c98a00;letter-spacing:1px;font-size:14px;flex:none}
.song .s-del{flex:none;width:30px;height:30px;border-radius:9px;border:2px solid var(--ink);background:#ffd0dc;font-weight:800;padding:0}
.empty{color:var(--mute);margin-bottom:22px}

/* play screen */
#chips{flex:none;display:flex;gap:8px;overflow-x:auto;padding:2px 16px 12px;scrollbar-width:none}
#chips::-webkit-scrollbar{display:none}
.seg{flex:none;display:flex;border:var(--line);border-radius:12px;overflow:hidden;background:var(--paper);box-shadow:0 4px 0 var(--ink)}
.seg button{border:0;background:none;color:var(--ink);padding:6px 11px;font-weight:800;font-size:14px;white-space:nowrap}
.seg button+button{border-left:2px solid var(--ink)}
.seg button.on{background:var(--sun)}
.seg span{padding:6px 4px;color:var(--ink);font-weight:800;font-size:14px;min-width:50px;text-align:center;font-variant-numeric:tabular-nums}
.chip{flex:none;white-space:nowrap}
#bubble{flex:none;margin:2px 16px 14px;position:relative;background:var(--paper);color:var(--ink);border:var(--line);border-radius:var(--r);padding:10px 14px;font-weight:800;font-size:clamp(17px,4.4vw,24px);line-height:1.2;text-wrap:balance;display:flex;align-items:center;gap:10px;min-height:54px}
#bubble::after{content:"";position:absolute;left:calc(50% - 12px);bottom:-13px;width:20px;height:20px;background:var(--paper);border-right:var(--line);border-bottom:var(--line);transform:rotate(45deg)}
#bubbleBig{font:400 44px/1 var(--display);flex:none}
#panel{flex:1;min-height:0;padding:0 16px 10px;display:flex;align-items:center;justify-content:center}
#stageWrap{position:relative;flex:1;min-height:150px}
.lay-song #panel,.lay-keys #panel{display:none}
.lay-keys #bubble{margin-top:auto;font-size:clamp(19px,5.2vw,30px);padding:14px 16px}
.lay-keys #stageWrap{flex:none;height:clamp(200px,54%,420px)}
.lay-panel #stageWrap{flex:none;height:clamp(110px,24%,200px)}
#hud{position:absolute;left:10px;top:12px;font-weight:800;font-size:14px;background:rgba(6,32,42,.7);border-radius:10px;padding:4px 9px;pointer-events:none;font-variant-numeric:tabular-nums}
.hl{display:flex;gap:12px;width:100%;max-width:620px;align-items:stretch}
.hl-b{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:12px 6px;background:var(--paper);color:var(--ink);border:var(--line);border-radius:var(--r);box-shadow:0 6px 0 var(--ink);font-weight:800;font-size:20px}
.hl-b:active{transform:translateY(5px);box-shadow:0 1px 0 var(--ink)}
.hl-b span{font-size:clamp(44px,13vw,76px);line-height:1.1}
.hl-b.again{flex:.6;background:var(--sun);font-size:15px}
.hl-b.again span{font-size:34px}
.hl-b.no{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.hand{width:min(100%,360px);max-height:100%}
.hand .fin{cursor:pointer}
.hand .fin rect{fill:var(--plonk);stroke:var(--ink);stroke-width:5}
.hand .fin.yes rect{fill:var(--sun)} .hand .fin.no rect{fill:var(--berry)}
.hand .palm{fill:var(--plonk);stroke:var(--ink);stroke-width:5}
.hand circle{fill:var(--paper);stroke:var(--ink);stroke-width:3}
.hand text{font:800 20px var(--body);fill:var(--ink);text-anchor:middle;dominant-baseline:central;pointer-events:none}

#soundOn{position:fixed;z-index:15;top:10px;left:50%;transform:translateX(-50%);max-width:calc(100% - 32px);font-size:15px}
#soundOn:active{transform:translateX(-50%) translateY(4px)}
/* sheets and results */
.sheet{position:fixed;inset:0;z-index:20;background:rgba(3,16,22,.6);display:flex;align-items:flex-end;justify-content:center}
.sheet-card{background:var(--paper);color:var(--ink);border:var(--line);border-bottom:0;border-radius:22px 22px 0 0;width:min(100%,620px);max-height:86%;display:flex;flex-direction:column}
.sheet-card header{display:flex;align-items:center;gap:10px;padding:14px 16px 8px}
.sheet-card header h3{flex:1;font-size:24px}
#sheetBody{overflow-y:auto;padding:4px 16px 22px;display:flex;flex-direction:column;gap:14px}
.opt{display:flex;flex-wrap:wrap;gap:10px 12px;align-items:flex-start;justify-content:space-between;border:2px solid var(--ink);border-radius:14px;padding:12px}
.opt>div{flex:1 1 220px;min-width:0}
.opt p{font-size:14px;opacity:.8;margin-top:3px;max-width:52ch}
.opt .status{font-weight:800;opacity:1;color:#1f6f1a}
.opt .status.bad{color:#b3124a}
.opt .btn{flex:none}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;font-weight:700}
.row select,.row input[type=range]{max-width:55%}
select{background:#fff;color:var(--ink);border:2px solid var(--ink);border-radius:10px;padding:6px 8px;font-weight:700}
input[type=checkbox]{width:24px;height:24px;accent-color:var(--plonk-d)}
input[type=range]{accent-color:var(--plonk-d)}
.fine{font-size:13px;opacity:.75}
.stick{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:8px}
.stick span{aspect-ratio:1;display:grid;place-items:center;font-size:28px;border:2px solid var(--ink);border-radius:12px;background:#fff}
.stick span.no{background:#d9e6dd;color:#8aa39a;font:800 20px var(--body)}
.overlay{position:fixed;inset:0;z-index:30;background:rgba(3,16,22,.72);display:grid;place-items:center;padding:16px;overflow:hidden}
.res-card{position:relative;background:var(--paper);color:var(--ink);border:var(--line);border-radius:24px;box-shadow:0 8px 0 var(--ink);padding:20px 20px 22px;width:min(100%,420px);text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.res-card h2{font-size:34px;line-height:1}
.stars{font-size:52px;line-height:1;color:#f5b400;-webkit-text-stroke:2.5px var(--ink);letter-spacing:4px}
.stars i{font-style:normal;color:#cfdcd3}
#resSticker{font-size:64px;line-height:1}
#resSticker small{display:block;font:800 14px var(--body);margin-top:4px}
.res-btns{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:6px}
.conf{position:absolute;top:-20px;width:11px;height:16px;border:2px solid var(--ink);border-radius:3px;animation:fall linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@media (max-height:520px){
  .bar{padding:6px 12px 4px} #chips{padding-bottom:8px} #bubble{margin-bottom:12px;padding:6px 12px;min-height:0;font-size:17px}
  .logo{font-size:46px} .home-top{gap:8px;padding-top:10px} .tag{display:none}
  .lay-panel #stageWrap{height:84px;min-height:0} .lay-keys #stageWrap{height:58%}
}
@media (prefers-reduced-motion:reduce){.lv.next .lv-ic,.conf,.hl-b.no{animation:none} .conf{display:none}}
</style>
</head>
<body>
<div id="app">
  <section id="home" class="screen">
    <div class="home-top">
      <h1 class="logo">Plonk</h1>
      <p class="tag">The piano monster who eats songs.</p>
      <div class="doors">
        <button class="door kid" id="goKids"><span class="em">🍪</span><b>Kids’ Adventure</b><small>Ages 5 and up · <span id="homeStars">0</span> ★</small></button>
        <button class="door" id="goSongs"><span class="em">🎼</span><b>Song Player</b><small>Play any song from a MIDI file</small></button>
      </div>
      <div class="home-row">
        <button class="btn sm" id="goConnect">🎹 Connect a piano</button>
        <button class="btn sm" id="goSettings">Settings</button>
      </div>
    </div>
    <div class="hero-wrap"><div class="hero-bubble" id="heroBubble">Tap my teeth!</div><canvas id="hero" aria-label="Plonk the piano monster. His teeth are piano keys you can play."></canvas></div>
  </section>

  <section id="kids" class="screen" hidden>
    <header class="bar">
      <button class="ib" data-go="home" aria-label="Back to start"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
      <h2>Kids’ Adventure</h2>
      <button class="btn sm" id="stickersBtn" aria-label="Sticker book">🏅 <span id="stickerCount"></span></button>
    </header>
    <div id="map" class="scroll"></div>
  </section>

  <section id="songs" class="screen" hidden>
    <header class="bar">
      <button class="ib" data-go="home" aria-label="Back to start"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
      <h2>Song Player</h2>
      <button class="btn sm" id="songsConnect">🎹 Connect</button>
    </header>
    <div class="scroll" id="songList">
      <div class="upload" id="drop">
        <b>Add your own song</b>
        <p>Choose a MIDI file (.mid or .midi). Free ones are easy to find: search for a song name plus “piano MIDI”.</p>
        <button class="btn sun" id="pick">Choose a MIDI file</button>
        <p id="upErr" class="err" hidden></p>
      </div>
      <h3 id="mineH">My songs</h3><div id="mine" class="list"></div>
      <h3>Built-in songs</h3><div id="builtin" class="list"></div>
    </div>
    <input type="file" id="file" accept=".mid,.midi,.kar,.rmi,audio/midi,audio/x-midi" hidden>
  </section>

  <section id="play" class="screen" hidden>
    <header class="bar">
      <button class="ib" id="pBack" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
      <div class="ttl"><b id="pTitle"></b><div class="meter" id="pMeter"><i></i></div></div>
      <button class="btn sm" id="pHear">👂 Hear it</button>
      <button class="ib" id="pRestart" aria-label="Start again"><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 3-6.2M4 4v5h5"/></svg></button>
      <button class="ib" id="pPlay" aria-label="Play or pause"><svg viewBox="0 0 24 24"><path id="pPlayIcon" d="M8 5l11 7-11 7z"/></svg></button>
      <button class="ib" id="pConn" aria-label="Connect a piano">🎹</button>
    </header>
    <div id="chips">
      <div class="seg" id="cMode" role="group" aria-label="Mode"><button data-v="wait">Wait for me</button><button data-v="rhythm">Keep time</button><button data-v="listen">Listen</button></div>
      <div class="seg" role="group" aria-label="Speed"><button id="cSlow" aria-label="Slower">−</button><span id="cSpeed">100%</span><button id="cFast" aria-label="Faster">+</button></div>
      <div class="seg" id="cHands" role="group" aria-label="Hands"><button data-v="both">Both hands</button><button data-v="R">Right</button><button data-v="L">Left</button></div>
      <button class="btn sm chip" id="cEasy">Melody only</button>
      <button class="btn sm chip" id="cLoop">Loop</button>
      <button class="btn sm chip" id="cMetro">Metronome</button>
      <button class="btn sm chip" id="cTracks">Tracks</button>
      <button class="btn sm chip" id="cSet">Settings</button>
    </div>
    <div id="bubble" role="status"><span id="bubbleBig"></span><span id="bubbleTxt"></span></div>
    <div id="panel"></div>
    <div id="stageWrap"><canvas id="stage" aria-label="Falling notes and piano keys"></canvas><div id="hud" hidden></div></div>
  </section>
</div>

<button id="soundOn" class="btn sun">🔈 Tap here to turn sound on</button>
<div id="sheet" class="sheet" hidden>
  <div class="sheet-card" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <header><h3 id="sheetTitle"></h3><button class="btn sm" id="sheetClose">Done</button></header>
    <div id="sheetBody"></div>
  </div>
</div>
<div id="result" class="overlay" hidden>
  <div class="res-card" role="dialog" aria-modal="true">
    <div class="stars" id="resStars"></div>
    <h2 id="resTitle"></h2>
    <p id="resText"></p>
    <div id="resSticker"></div>
    <div class="res-btns" id="resBtns"></div>
  </div>
</div>
<script>
'use strict';
/* ========== helpers ========== */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const pick = a => a[Math.floor(Math.random() * a.length)];
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const NAMES = ['C', 'C♯', 'D', 'D♯', 'E', 'F', 'F♯', 'G', 'G♯', 'A', 'A♯', 'B'];
const SOLF = ['Do', 'Do♯', 'Re', 'Re♯', 'Mi', 'Fa', 'Fa♯', 'Sol', 'Sol♯', 'La', 'La♯', 'Ti'];
const SNACK = { 0: '🍪', 2: '🍩', 4: '🥚', 5: '🍟', 7: '🍇', 9: '🍎', 11: '🍌' };
const SNACK_WORD = { 0: 'cookie', 2: 'donut', 4: 'egg', 5: 'fries', 7: 'grapes', 9: 'apple', 11: 'banana' };
const BLACK = [0, 1, 0, 1, 0, 0, 1, 0, 1, 0, 1, 0];
const pc = m => ((m % 12) + 12) % 12;
const isBlack = m => BLACK[pc(m)] === 1;
const midiFreq = m => 440 * Math.pow(2, (m - 69) / 12);
// one colour per note name (the classroom "colour note" convention), darker twin for the sharps
const PC_COL = ['#ff5c68', '#d63c58', '#ff9a2e', '#d67718', '#ffd84a', '#5fd470', '#2fa850', '#27cdbd', '#149c8f', '#5b9bff', '#3272e0', '#bd83ff'];
const pcColor = m => PC_COL[pc(m)];
const COL = { ink: '#06202a', pond: '#0e3443', pond2: '#15475a', paper: '#f2fbf0', plonk: '#8be04e', plonkD: '#58b12a', sun: '#ffc83d', berry: '#ff5d8f', right: '#ffc83d', left: '#56ccf2', bg: '#86aab0' };
function parseNote(s) {
  const m = /^([A-G])([#b]?)(-?\d)$/.exec(s);
  if (!m) throw new Error('bad note ' + s);

}

/* ========== sheets ========== */
function openSheet(title, html, wire) { $('#sheetTitle').textContent = title; $('#sheetBody').innerHTML = html; $('#sheet').hidden = false; sheetTick = null; if (wire) wire($('#sheetBody')); $('#sheetClose').focus(); }
function closeSheet() { $('#sheet').hidden = true; sheetTick = null; window.refreshConnect = null; }
function connBtn() { const on = Mic.active || MidiIn.names.length > 0; for (const id of ['#pConn', '#goConnect', '#songsConnect']) $(id).classList.toggle('on', on); }
function micMsg(e) {
  const n = e && e.name;
  if (n === 'NoMic') return 'This browser cannot use the microphone. Try Chrome or Safari.';
  if (n === 'NotAllowedError' || n === 'SecurityError') return 'The microphone is blocked here. Open Plonk in its own browser tab from a web link, then allow the microphone.';
  if (n === 'NotFoundError') return 'No microphone was found on this device.';
  return 'The microphone did not start. Close other apps that use it and try again.';
}
function connectSheet() {
  openSheet('Connect a piano', `
    <div class="opt"><div><b>🎤 Listen with the microphone</b><p>For a real piano, or any keyboard with its own speakers. Put this device close to the piano. Single notes are heard best; big chords are harder.</p><p class="status" id="micStatus"></p></div><button class="btn sun" id="micBtn"></button></div>
    <label class="row">How well Plonk hears <select id="micSens"><option value="0">A little (noisy room)</option><option value="1">Normal</option><option value="2">A lot (quiet piano)</option></select></label>
    <div class="opt"><div><b>🎹 Plug in a MIDI keyboard</b><p>For digital pianos and keyboards with a USB cable. The most exact way, and chords work too.</p><p class="status" id="midiStatus"></p></div><button class="btn sun" id="midiBtn">Connect</button></div>
    <label class="row">Play Plonk’s piano sound for my MIDI keyboard <input type="checkbox" id="midiSound"></label>
    <div class="opt"><div><b>👆 Touch or computer keys</b><p>Always on. Tap the teeth on screen, or use the computer keys A S D F G H J K for white keys and W E T Y U for black keys. Z and X move an octave.</p></div></div>`, b => {
    const refresh = () => {
      $('#micBtn', b).textContent = Mic.active ? 'Stop' : 'Start listening';
      const ms = $('#micStatus', b); ms.className = 'status' + (Conn.micErr ? ' bad' : ''); ms.textContent = Conn.micErr || (Mic.active ? 'Listening…' : '');
      const ds = $('#midiStatus', b); ds.className = 'status' + (Conn.midiErr ? ' bad' : '');
      ds.textContent = Conn.midiErr || (MidiIn.access ? (MidiIn.names.length ? 'Connected: ' + MidiIn.names.join(', ') : 'No keyboard found yet. Plug it in and switch it on.') : '');
      connBtn();
    };
    window.refreshConnect = refresh; $('#micSens', b).value = String(S.settings.micSens); $('#midiSound', b).checked = S.settings.midiSound;
    $('#micSens', b).onchange = e => { S.settings.micSens = +e.target.value; saveState(); };
    $('#midiSound', b).onchange = e => { S.settings.midiSound = e.target.checked; saveState(); };
    $('#micBtn', b).onclick = async () => { Conn.micErr = ''; if (Mic.active) Mic.stop(); else { try { await Mic.start(); } catch (e) { Conn.micErr = micMsg(e); } } refresh(); };
    $('#midiBtn', b).onclick = async () => { Conn.midiErr = ''; try { await MidiIn.connect(); } catch (e) { Conn.midiErr = e && e.name === 'NoMidi' ? 'This browser does not support MIDI keyboards. Use Chrome or Edge.' : 'MIDI is blocked here. Open Plonk in its own browser tab from a web link, then allow MIDI.'; } refresh(); };
    let at = 0; sheetTick = now => { if (Mic.active && !Conn.micErr && now - at > 0.15) { at = now; const h = Mic.heard; $('#micStatus', b).textContent = h != null ? 'Listening… I hear ' + NAMES[pc(h)] + (Math.floor(h / 12) - 1) : 'Listening… play a note'; } };
    refresh();
  });
}
function applySettings() { for (const st of [hero, stage]) { st.labels = S.settings.labels; st.colors = S.settings.colors; } saveState(); }
function settingsSheet() {
  const s = S.settings, sel = (id, opts, v) => `<select id="${id}">` + opts.map(([val, label]) => `<option value="${val}"${val === v ? ' selected' : ''}>${label}</option>`).join('') + '</select>';
  openSheet('Settings', `
    <label class="row">Plonk talks out loud <input type="checkbox" id="sVoice"${s.voice ? ' checked' : ''}></label>
    <label class="row">Sound volume <input type="range" id="sVol" min="0" max="1" step="0.05" value="${s.volume}"></label>
    <label class="row">Note names ${sel('sLabels', [['letters', 'C D E'], ['solfege', 'Do Re Mi'], ['off', 'Hidden']], s.labels)}</label>
    <label class="row">Note colours ${sel('sColors', [['rainbow', 'One colour per note'], ['hands', 'One colour per hand']], s.colors)}</label>
    <label class="row">Open every kids’ level (for grown-ups) <input type="checkbox" id="sUnlock"${s.unlockAll ? ' checked' : ''}></label>
    <div class="row"><span>Stars and stickers</span><button class="btn sm berry" id="sReset">Erase progress</button></div>
    <p class="fine">Progress and your added songs are kept in this browser on this device only.</p>`, b => {
    $('#sVoice', b).onchange = e => { s.voice = e.target.checked; if (!s.voice) hush(); saveState(); };
    $('#sVol', b).oninput = e => { Sound.setVolume(+e.target.value); saveState(); };
    $('#sLabels', b).onchange = e => { s.labels = e.target.value; applySettings(); };
    $('#sColors', b).onchange = e => { s.colors = e.target.value; applySettings(); };
    $('#sUnlock', b).onchange = e => { s.unlockAll = e.target.checked; saveState(); if (App.screen === 'kids') renderMap(); };
    let armed = false; $('#sReset', b).onclick = e => { if (!armed) { armed = true; e.target.textContent = 'Tap again to erase'; return; } S.progress = {}; S.best = {}; saveState(); e.target.textContent = 'Erased'; e.target.disabled = true; if (App.screen === 'kids') renderMap(); $('#homeStars').textContent = '0'; };
  });
}
function tracksSheet() {
  const sg = App.song, pl = App.player; if (!sg || !pl) return; const names = n => NAMES[pc(n)] + (Math.floor(n / 12) - 1);
  openSheet('Tracks', '<p class="fine">Choose which part each hand plays. Background parts play by themselves.</p>' + sg.parts.map((p, i) => `<label class="row"><span><b>${esc(p.name)}</b><br><span class="fine">${p.count} notes · ${names(p.lo)} to ${names(p.hi)}</span></span><select data-p="${i}">` +
    [['R', 'Right hand'], ['L', 'Left hand'], ['split', 'Both hands, split at middle C'], ['bg', 'Background'], ['off', 'Off']].map(([v, l]) => `<option value="${v}"${p.role === v ? ' selected' : ''}>${l}</option>`).join('') + '</select></label>').join(''), b => {
    b.onchange = e => { const i = e.target.dataset.p; if (i == null) return; sg.parts[+i].role = e.target.value; applyRoles(sg); fitSong(sg); pl.rebuild(); chips(); };
  });
}
function stickerSheet() {
  openSheet('Sticker book', '<div class="stick">' + ALL_LEVELS.map((l, i) => S.progress[l.id] ? `<span title="${esc(l.title)}">${STICKERS[i]}</span>` : '<span class="no">?</span>').join('') + `</div><p class="fine">${doneCount()} of ${ALL_LEVELS.length} stickers. Finish a level to win its sticker.</p>`);
}
function hideResult() { $('#result').hidden = true; }
function showResult(o) {
  $('#resStars').innerHTML = '★'.repeat(o.stars) + '<i>' + '★'.repeat(3 - o.stars) + '</i>'; $('#resTitle').textContent = o.title; $('#resText').textContent = o.text;
  $('#resSticker').innerHTML = o.sticker ? o.sticker + '<small>New sticker</small>' : '';
  const bx = $('#resBtns'), ov = $('#result'); bx.innerHTML = '';
  for (const [label, cls, fn] of o.btns) { const b = document.createElement('button'); b.className = 'btn ' + cls; b.textContent = label; b.onclick = fn; bx.appendChild(b); }
  $$('.conf', ov).forEach(c => c.remove()); ov.hidden = false;
  if (o.stars >= 2) for (let i = 0; i < 26; i++) { const c = document.createElement('i'); c.className = 'conf'; c.style.cssText = `left:${Math.random() * 100}%;background:${pick(PC_COL)};animation-duration:${1.6 + Math.random() * 1.8}s;animation-delay:${Math.random() * 0.5}s`; ov.appendChild(c); }
}

/* ========== start ========== */
function start(data) {
  loadState(); mergeState(data); Mine.load();
  hero = new Stage($('#hero'), { roll: false }); hero.setRange(60, 72); stage = new Stage($('#stage'), { roll: true });
  for (const st of [hero, stage]) { st.onNoteOn = m => Input.on(m, 'touch'); st.onNoteOff = m => Input.off(m, 'touch'); }
  stage.onScrub = d => { if (App.player && !App.kid) App.player.scrub(d); };
  stage.onTap = () => { if (App.player && !App.kid) App.player.toggle(); };
  for (const ev of ['pointerdown', 'pointerup', 'touchend', 'click', 'keydown']) addEventListener(ev, () => Sound.unlock(), { capture: true, passive: true });
  $('#soundOn').onclick = () => {
    Sound.restart(); soundTries++; const btn = $('#soundOn');
    setTimeout(() => { if (Sound.state() === 'running') { Sound.fanfare(); btn.hidden = true; } else btn.textContent = soundTries > 1 ? '🔇 Sound is blocked here (' + Sound.state() + '). Tap to try again' : '🔈 Tap once more to turn sound on'; }, 350);
  };
  $('#goKids').onclick = () => show('kids'); $('#goSongs').onclick = () => show('songs');
  for (const id of ['#goConnect', '#songsConnect', '#pConn']) $(id).onclick = connectSheet;
  $('#goSettings').onclick = $('#cSet').onclick = settingsSheet; $('#stickersBtn').onclick = stickerSheet;
  $$('[data-go]').forEach(b => b.onclick = () => show(b.dataset.go));
  $('#map').addEventListener('click', e => { const b = e.target.closest('.lv'); if (b && !b.disabled) openLevel(ALL_LEVELS.find(l => l.id === b.dataset.lv)); });
  $('#pBack').onclick = () => show(App.back);
  $('#pRestart').onclick = () => { const pl = App.player; if (!pl) return; hideResult(); if (pl.mode === 'listen' && App.kid) hearIt(); else pl.restart(); };
  $('#pPlay').onclick = () => App.player && App.player.toggle(); $('#pHear').onclick = hearIt;
  $('#bubble').onclick = () => { if (App.lastSay) say(App.lastSay); };
  $('#cMode').onclick = e => { const v = e.target.dataset.v; if (v && App.player) { App.player.set('mode', v); App.player.start(); chips(); } };
  $('#cHands').onclick = e => { const v = e.target.dataset.v; if (v && App.player) { App.player.set('hands', v); chips(); } };
  const speed = d => { const pl = App.player; if (pl) { pl.speed = clamp(Math.round((pl.speed + d) * 10) / 10, 0.3, 1.5); chips(); } };
  $('#cSlow').onclick = () => speed(-0.1); $('#cFast').onclick = () => speed(0.1);
  $('#cEasy').onclick = () => { const pl = App.player; if (pl) { pl.set('easy', !pl.easy); chips(); } };
  $('#cMetro').onclick = () => { const pl = App.player; if (pl) { pl.metro = !pl.metro; chips(); } };
  $('#cLoop').onclick = () => {
    const pl = App.player; if (!pl) return;
    if (!pl.loop) pl.loop = { a: Math.max(0, pl.time), b: null };
    else if (pl.loop.b == null && pl.time > pl.loop.a + 0.5) { pl.loop.b = pl.time; pl.seek(pl.loop.a); }
    else pl.loop = null;
    chips();
  };
  $('#cTracks').onclick = tracksSheet;
  $('#sheetClose').onclick = closeSheet; $('#sheet').addEventListener('pointerdown', e => { if (e.target.id === 'sheet') closeSheet(); });
  $('#pick').onclick = () => $('#file').click();
  $('#file').onchange = e => { const f = e.target.files[0]; e.target.value = ''; if (f) addFile(f); };
  const drop = $('#songs');
  drop.addEventListener('dragover', e => { e.preventDefault(); $('#drop').classList.add('over'); });
  drop.addEventListener('dragleave', () => $('#drop').classList.remove('over'));
  drop.addEventListener('drop', e => { e.preventDefault(); $('#drop').classList.remove('over'); const f = e.dataTransfer && e.dataTransfer.files[0]; if (f) addFile(f); });
  $('#songList').addEventListener('click', e => {
    const del = e.target.closest('[data-del]'); if (del) { Mine.list.splice(+del.dataset.del, 1); Mine.save(); renderSongs(); return; }
    const mine = e.target.closest('[data-mine]'); if (mine) return openMine(+mine.dataset.mine);
    const b = e.target.closest('[data-b]'); if (b) openSong(makeSong(b.dataset.b));
  });
  $('#songList').addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[data-mine]')) { e.preventDefault(); openMine(+e.target.dataset.mine); } });
  addEventListener('hashchange', route);
  document.addEventListener('visibilitychange', () => { if (document.hidden && App.player && !App.kid) App.player.pause(); if (document.hidden) Sound.allOff(); });
  App.handler = heroTap; $('#homeStars').textContent = totalStars(); route();
  try { const hot = window.claude && window.claude.hot; if (hot && hot.snapshot) hot.snapshot(() => ({ settings: S.settings, progress: S.progress, best: S.best })); } catch (e) { }
  requestAnimationFrame(loop);
}
(function () { const hot = window.claude && window.claude.hot; if (hot && hot.ready) hot.ready(start); else start((hot && hot.data) || {}); })();
</script>
</body>
</html>
